services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: client-edits-ai-dev
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
